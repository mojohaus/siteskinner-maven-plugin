version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    exclude-paths:
      - "src/it/**"
    schedule:
      interval: "monthly"
    groups:
      maven:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Baseline is Maven 3.9 with Resolver 1.9; Maven 3.10 pulls Resolver 2.x.
      # Excludes the Maven artifacts this plugin uses.
      - dependency-name: "org.apache.maven:maven-artifact"
        versions: [">= 3.10.0"]
      - dependency-name: "org.apache.maven:maven-compat"
        versions: [">= 3.10.0"]
      - dependency-name: "org.apache.maven:maven-core"
        versions: [">= 3.10.0"]
      - dependency-name: "org.apache.maven:maven-model"
        versions: [">= 3.10.0"]
      - dependency-name: "org.apache.maven:maven-plugin-api"
        versions: [">= 3.10.0"]
      # plexus-xml 4.x depends on the Maven 4 XML API.
      - dependency-name: "org.codehaus.plexus:plexus-xml"
        versions: [">= 4.0.0"]
      # Doxia 2 is a separate migration, see #7.
      - dependency-name: "org.apache.maven.doxia:*"
        versions: [">= 2.0.0-M1"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns: ["*"]
